name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp version from release tag
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${GITHUB_EVENT_RELEASE_TAG_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          jq --arg v "$VERSION" '.version = $v' package.json > package.tmp && mv package.tmp package.json

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck

      - name: Build
        run: node esbuild.config.mjs production

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${GITHUB_EVENT_RELEASE_TAG_NAME}" main.js styles.css manifest.json

      - name: Update release files via PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${GITHUB_EVENT_RELEASE_TAG_NAME#v}"
          BRANCH="chore/versions-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git fetch origin main
          git checkout -b "${BRANCH}" origin/main

          MIN_APP_VERSION=$(jq -r '.minAppVersion' manifest.json)

          jq --arg v "$VERSION" --arg min "$MIN_APP_VERSION" '. + {($v): $min}' versions.json > versions.tmp && mv versions.tmp versions.json
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          jq --arg v "$VERSION" '.version = $v' package.json > package.tmp && mv package.tmp package.json

          git add versions.json manifest.json package.json
          git commit -m "chore: release ${VERSION}"
          git push --force origin "${BRANCH}"

          PR_NUMBER=$(gh pr list --head "${BRANCH}" --json number --jq '.[0].number // empty')
          if [ -n "${PR_NUMBER}" ]; then
            gh pr edit "${PR_NUMBER}" \
              --title "chore: release ${VERSION}" \
              --body "Automated PR to update \`versions.json\`, \`manifest.json\`, and \`package.json\` after release \`${VERSION}\`."
          else
            gh pr create \
              --title "chore: release ${VERSION}" \
              --body "Automated PR to update \`versions.json\`, \`manifest.json\`, and \`package.json\` after release \`${VERSION}\`." \
              --base main \
              --head "${BRANCH}"
          fi
